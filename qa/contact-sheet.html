<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:#0d0f12;color:#f1ece4;font-family:Arial,sans-serif}.sheet{width:1200px;padding:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{height:320px;border:1px solid #343941;background:#14171b;display:grid;grid-template-rows:1fr auto;padding:18px}.card img{width:100%;height:245px;object-fit:contain}.card:nth-child(2),.card:nth-child(7),.card:nth-child(8){grid-column:span 2}.card:nth-child(2){height:440px}.card:nth-child(2) img{height:365px}.card:nth-child(7),.card:nth-child(8){height:380px}.card:nth-child(7) img,.card:nth-child(8) img{height:305px}.name{font-weight:800;color:#eac07c;font-size:14px;padding-top:10px}</style></head><body><main class="sheet"><div class="card"><img src="../assets/brand-mark.svg"><div class="name">brand-mark.svg</div></div><div class="card"><img src="../assets/hero-cat.svg"><div class="name">hero-cat.svg</div></div><div class="card"><img src="../assets/privacy-shield.svg"><div class="name">privacy-shield.svg</div></div><div class="card"><img src="../assets/community-paws.svg"><div class="name">community-paws.svg</div></div><div class="card"><img src="../assets/global-cat.svg"><div class="name">global-cat.svg</div></div><div class="card"><img src="../assets/meme-spark.svg"><div class="name">meme-spark.svg</div></div><div class="card"><img src="../assets/about-cat.svg"><div class="name">about-cat.svg</div></div><div class="card"><img src="../assets/community-cat.svg"><div class="name">community-cat.svg</div></div></main></body></html>
